metrics_to_run:
  - custom_response_quality
  - legal_guardrails_score
  - malayalam_terminology_score

custom_metrics:
  # Comprehensive local LLM-as-judge (see response_quality.py).
  # Evaluates legal accuracy, statutory disclaimers, Malayalam terms, and clean title guardrails.
  - name: custom_response_quality
    custom_function_file: response_quality.py
  # Dedicated metric for statutory advocate disclaimers and 100% clean title guardrails
  - name: legal_guardrails_score
    custom_function_file: guardrails_metric.py
  # Dedicated metric for authentic Malayalam property and revenue terminology
  - name: malayalam_terminology_score
    custom_function_file: terminology_metric.py
  - name: agent_turn_count
    custom_function: |
      def evaluate(instance):
          turns = (instance.get("agent_data") or {}).get("turns", [])
          return {'score': len(turns)}
